name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats SVG
        env:
          GH_USERNAME: bytebandit-07
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-stats.mjs

      - name: Generate top languages SVG
        env:
          GH_USERNAME: bytebandit-07
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-top-langs.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update GitHub stats [automated]"
          git push
